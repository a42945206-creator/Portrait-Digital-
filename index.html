<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>portraitdigital.t.me</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: #111113;
    --line: #1f1f23;
    --line-soft: #17171a;
    --text: #ededef;
    --muted: #6e6e78;
    --dim: #46464f;
    --focus: #2a2a30;
    --error-text: #d98a8a;
    --accent: #4ade80;
    --accent-2: #38bdf8;
    --accent-3: #facc15;
    --accent-4: #c084fc;
    --status-pending-bg: #3a2f0a; --status-pending-text: #facc15;
    --status-in-progress-bg: #0a2a3a; --status-in-progress-text: #38bdf8;
    --status-completed-bg: #0a2a15; --status-completed-text: #4ade80;
    --status-materials-bg: #2a1a3a; --status-materials-text: #c084fc;
  }
  [data-theme="light"] {
    --bg: #f5f5f7; --panel: #ffffff; --line: #e5e5ea; --line-soft: #f0f0f3;
    --text: #1a1a1c; --muted: #6e6e78; --dim: #a0a0a8; --focus: #d0d0d8;
    --error-text: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center; padding: 40px 20px 20px; min-height: 100vh;
    transition: background .25s, color .25s; overscroll-behavior-y: contain;
  }
  .shell {
    width: 100%; max-width: 460px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    align-self: flex-start; position: relative; animation: shellIn .35s ease;
  }
  @keyframes shellIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .mark { width: 20px; height: 20px; border: 1px solid var(--dim); border-radius: 5px; position: relative; flex-shrink: 0; }
  .mark::after { content: ''; position: absolute; inset: 4px; background: var(--text); border-radius: 1px; }
  .name { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12.5px; color: var(--muted); }
  .head .arrow { margin-left: auto; color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }
  .theme-btn {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center; margin-left: auto; transition: all .14s;
  }
  .theme-btn:hover { color: var(--text); border-color: var(--dim); }
  .body { padding: 20px 18px; min-height: 200px; }
  .label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  input[type="text"], input[type="password"], textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 11px 13px; color: var(--text); font-size: 14px; font-family: inherit; outline: none;
    transition: border-color .12s, background .12s;
  }
  textarea { resize: vertical; min-height: 90px; line-height: 1.55; }
  input::placeholder, textarea::placeholder { color: var(--dim); }
  input:focus, textarea:focus { border-color: var(--focus); }
  .row { margin-bottom: 14px; position: relative; }
  .btn {
    width: 100%; padding: 11px; background: var(--text); color: var(--panel);
    border: 1px solid var(--text); border-radius: 6px; font-size: 13.5px; font-weight: 550;
    font-family: inherit; cursor: pointer; transition: opacity .12s;
  }
  .btn:hover:not(:disabled) { opacity: .88; }
  .btn:active:not(:disabled) { opacity: .75; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 450; }
  .btn-ghost:hover { color: var(--text); border-color: var(--dim); opacity: 1; }
  .meta { font-size: 12px; color: var(--dim); margin-top: 10px; text-align: center; font-family: ui-monospace, monospace; }
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 16px;
  }
  .topbar .who { font-size: 12.5px; color: var(--muted); flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbar .who b { color: var(--text); font-weight: 550; font-family: ui-monospace, monospace; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 12px; color: #fff; font-family: ui-monospace, monospace;
  }
  .avatar.sm { width: 22px; height: 22px; font-size: 10px; }
  .exit {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-family: ui-monospace, monospace; font-size: 11px; padding: 4px 9px;
    border-radius: 4px; cursor: pointer; transition: all .12s;
  }
  .exit:hover { color: var(--text); border-color: var(--dim); }
  .tag {
    font-family: ui-monospace, monospace; font-size: 10px; color: var(--dim);
    border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.04em; display: inline-block;
  }
  .tag-admin { color: var(--accent-3); border-color: var(--accent-3); }
  .tag-user { color: var(--accent-2); border-color: var(--accent-2); }
  .tag-pending { color: #f87171; border-color: #f87171; }
  .tag-banned { color: #dc2626; border-color: #dc2626; }
  .section-h {
    font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 10px; font-family: ui-monospace, monospace;
    display: flex; align-items: center; gap: 8px;
  }
  .section-h .count {
    background: var(--line-soft); border: 1px solid var(--line);
    padding: 1px 6px; border-radius: 10px; font-size: 10px;
  }
  .filters { display: flex; gap: 5px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters button {
    background: var(--line-soft); color: var(--muted); border: 1px solid var(--line);
    padding: 5px 11px; border-radius: 20px; font-size: 11.5px; cursor: pointer;
    font-family: ui-monospace, monospace; transition: all .14s;
  }
  .filters button:hover { color: var(--text); }
  .filters button.active { background: var(--text); color: var(--panel); border-color: var(--text); }
  .item {
    border: 1px solid var(--line); border-radius: 6px; padding: 13px 15px;
    margin-bottom: 9px; background: var(--bg); animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; gap: 8px; }
  .item-top .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .item-top .from { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-top .when { font-size: 10.5px; color: var(--dim); font-family: ui-monospace, monospace; flex-shrink: 0; }
  .item .msg { font-size: 13.5px; color: var(--muted); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .item-status { font-size: 10.5px; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-top: 7px; font-family: ui-monospace, monospace; }
  .item-status.status-pending { background: var(--status-pending-bg); color: var(--status-pending-text); }
  .item-status.status-in-progress { background: var(--status-in-progress-bg); color: var(--status-in-progress-text); }
  .item-status.status-completed { background: var(--status-completed-bg); color: var(--status-completed-text); }
  .item-status.status-materials { background: var(--status-materials-bg); color: var(--status-materials-text); }
  .item .info-line { font-size: 11.5px; color: var(--muted); margin-top: 5px; font-family: ui-monospace, monospace; }
  .item-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  .item-actions button, .item-actions input {
    background: var(--line-soft); color: var(--muted); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
    transition: background .12s, color .12s, border-color .12s; font-family: inherit;
  }
  .item-actions input { cursor: text; width: 100%; }
  .item-actions button:hover { background: var(--focus); color: var(--text); border-color: var(--focus); }
  .item-actions button.danger { color: #f87171; border-color: #7f1d1d; }
  .item-actions button.danger:hover { background: #7f1d1d; color: #fff; }
  .item-actions button.good { color: var(--accent); border-color: #166534; }
  .item-actions button.good:hover { background: #166534; color: #fff; }
  .none { padding: 28px 0; text-align: center; color: var(--dim); font-size: 12.5px; font-family: ui-monospace, monospace; }
  .err { color: var(--error-text); font-size: 12px; margin-top: 6px; min-height: 15px; }
  .info { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .pass-wrap { position: relative; }
  .pass-toggle {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--dim); cursor: pointer;
    font-size: 14px; padding: 4px 6px;
  }
  .pass-toggle:hover { color: var(--text); }
  .skel {
    background: linear-gradient(90deg, var(--line-soft) 25%, var(--line) 50%, var(--line-soft) 75%);
    background-size: 200% 100%; animation: skel 1.4s ease-in-out infinite;
    border-radius: 6px;
  }
  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skel-item { height: 90px; margin-bottom: 9px; }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--panel); color: var(--text); padding: 11px 18px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px; z-index: 999; opacity: 0;
    transition: all .25s ease; pointer-events: none; max-width: 90%;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: #166534; }
  #toast.err { border-color: #7f1d1d; }
  #ptr {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%) translateY(-60px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 50%;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; z-index: 998; transition: transform .2s; pointer-events: none;
  }
  #ptr.show { transform: translateX(-50%) translateY(20px); }
  #ptr.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: translateX(-50%) translateY(20px) rotate(360deg); } }
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <div class="mark"></div>
    <span class="name">portraitdigital.t.me</span>
    <button class="theme-btn" id="themeBtn" title="Тема">🌙</button>
  </div>
  <div class="body" id="app">
    <div class="none">Загрузка…</div>
  </div>
</div>
<div id="toast"></div>
<div id="ptr">⟳</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.8.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, collection,
  addDoc, getDocs, query, where, deleteDoc
} from "https://www.gstatic.com/firebasejs/11.8.0/firebase-firestore.js";

/* === FIREBASE CONFIG === */
const firebaseConfig = {
  apiKey: "AIzaSyDPev6S3AB-x3P17we28B8A5lExxAQOdCc",
  authDomain: "portrait-digital.firebaseapp.com",
  projectId: "portrait-digital",
  storageBucket: "portrait-digital.firebasestorage.app",
  messagingSenderId: "822814348389",
  appId: "1:822814348389:web:a1dc1909cf58607f46e28c"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* === КОНСТАНТЫ === */
const MAIN_ADMIN = 'newerwhyplant';
const EMAIL_DOMAIN = '@portraitdigital.local';

/* === УТИЛИТЫ === */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = u => (u||'').trim().replace(/^@/, '');
const usernameToEmail = u => u.toLowerCase() + EMAIL_DOMAIN;
const fmtDate = iso => new Date(iso).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.className = '', 2600);
}
function setLoading(btn, on, text = 'Загрузка…') {
  if (!btn) return;
  if (on) { btn._old = btn.textContent; btn.textContent = text; btn.disabled = true; }
  else { btn.textContent = btn._old; btn.disabled = false; }
}
const STATUS_NAMES = { pending: 'Ожидает', 'in-progress': 'В работе', completed: 'Выполнено', materials: 'Материалы' };
const statusName = s => STATUS_NAMES[s] || 'Неизвестно';

/* === АВАТАРКИ === */
const AVATAR_COLORS = ['#ef4444','#f97316','#eab308','#84cc16','#22c55e','#14b8a6','#06b6d4','#3b82f6','#6366f1','#8b5cf6','#a855f7','#ec4899','#f43f5e'];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function avatarHtml(name, size = '') {
  const cls = 'avatar' + (size === 'sm' ? ' sm' : '');
  const initial = (name || '?')[0].toUpperCase();
  return `<div class="${cls}" style="background:${avatarColor(name)}">${initial}</div>`;
}

/* === ТЕМА === */
const savedTheme = localStorage.getItem('pd_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';
document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('pd_theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
};

/* === PULL-TO-REFRESH === */
let ptrStart = 0;
document.addEventListener('touchstart', e => {
  if (window.scrollY === 0) ptrStart = e.touches[0].clientY;
});
document.addEventListener('touchmove', e => {
  if (ptrStart && window.scrollY === 0) {
    const delta = e.touches[0].clientY - ptrStart;
    if (delta > 60) document.getElementById('ptr').classList.add('show');
  }
});
document.addEventListener('touchend', async () => {
  const ptr = document.getElementById('ptr');
  if (ptr.classList.contains('show')) {
    ptr.classList.add('spin');
    try {
      if (currentProfile) route();
    } finally {
      setTimeout(() => { ptr.classList.remove('show', 'spin'); ptrStart = 0; }, 600);
    }
  }
  ptrStart = 0;
});

/* === СОСТОЯНИЕ === */
let currentProfile = null;
let currentFilter = 'all';

onAuthStateChanged(auth, async (user) => {
  if (!user) { currentProfile = null; viewLogin(); return; }
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) { await signOut(auth); return; }
  const data = snap.data();
  currentProfile = {
    uid: user.uid,
    username: data.username,
    isApproved: data.isApproved,
    role: data.role || 'user',
    banned: !!data.banned
  };
  if (currentProfile.banned) {
    app.innerHTML = `<div class="none">🚫 Ваш аккаунт заблокирован. Обратитесь к администратору.</div>`;
    return;
  }
  route();
});

function route() {
  if (!currentProfile) return viewLogin();
  if (currentProfile.username.toLowerCase() === MAIN_ADMIN.toLowerCase() || currentProfile.role === 'admin') return viewAdmin();
  if (currentProfile.isApproved) return viewUser();
  return viewPending();
}

/* === ЛОГИН === */
function viewLogin() {
  app.innerHTML = `
    <div class="row">
      <label class="label">Ваш юзернейм в Telegram</label>
      <input type="text" id="u" placeholder="@username" autocomplete="off" spellcheck="false">
      <div class="err" id="uErr"></div>
    </div>
    <div class="row">
      <label class="label">Пароль</label>
      <div class="pass-wrap">
        <input type="password" id="p" placeholder="Введите пароль">
        <button type="button" class="pass-toggle" data-for="p">👁</button>
      </div>
      <div class="err" id="pErr"></div>
    </div>
    <button class="btn" id="loginBtn">Войти</button>
    <div class="meta" style="margin-top:20px;">
      Нет аккаунта?
      <button class="btn btn-ghost" id="toReg" style="width:auto;padding:5px 10px;margin-top:0;font-size:12px;font-weight:400;">Зарегистрироваться</button>
    </div>
  `;
  const uEl = app.querySelector('#u'), pEl = app.querySelector('#p');
  const uErr = app.querySelector('#uErr'), pErr = app.querySelector('#pErr');
  uEl.oninput = () => uErr.textContent = '';
  pEl.oninput = () => pErr.textContent = '';
  app.querySelectorAll('.pass-toggle').forEach(b => {
    b.onclick = () => { const i = app.querySelector('#' + b.dataset.for); i.type = i.type === 'password' ? 'text' : 'password'; };
  });
  app.querySelector('#toReg').onclick = () => viewRegister();
  app.querySelector('#loginBtn').onclick = async () => {
    const u = norm(uEl.value), p = pEl.value;
    if (u.length < 2) return uErr.textContent = 'Введите юзернейм';
    if (p.length < 6) return pErr.textContent = 'Минимум 6 символов';
    const btn = app.querySelector('#loginBtn');
    setLoading(btn, true, 'Вход…');
    try {
      await signInWithEmailAndPassword(auth, usernameToEmail(u), p);
    } catch (e) {
      setLoading(btn, false);
      const c = e.code || '';
      if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) pErr.textContent = 'Неверный юзернейм или пароль';
      else if (c.includes('too-many-requests')) pErr.textContent = 'Слишком много попыток';
      else pErr.textContent = 'Ошибка: ' + c;
    }
  };
  uEl.focus();
}

/* === РЕГИСТРАЦИЯ === */
function viewRegister() {
  app.innerHTML = `
    <div class="row">
      <label class="label">Ваш юзернейм в Telegram</label>
      <input type="text" id="u" placeholder="@username" autocomplete="off" spellcheck="false">
      <div class="err" id="uErr"></div>
    </div>
    <div class="row">
      <label class="label">Пароль (мин. 6 символов)</label>
      <div class="pass-wrap">
        <input type="password" id="p" placeholder="пароль">
        <button type="button" class="pass-toggle" data-for="p">👁</button>
      </div>
      <div class="err" id="pErr"></div>
    </div>
    <div class="row">
      <label class="label">Повторите пароль</label>
      <div class="pass-wrap">
        <input type="password" id="cp" placeholder="повторите">
        <button type="button" class="pass-toggle" data-for="cp">👁</button>
      </div>
      <div class="err" id="cpErr"></div>
    </div>
    <button class="btn" id="regBtn">Зарегистрироваться</button>
    <div class="meta" style="margin-top:20px;">
      Уже есть аккаунт?
      <button class="btn btn-ghost" id="toLog" style="width:auto;padding:5px 10px;margin-top:0;font-size:12px;font-weight:400;">Войти</button>
    </div>
  `;
  const uEl = app.querySelector('#u'), pEl = app.querySelector('#p'), cpEl = app.querySelector('#cp');
  const uErr = app.querySelector('#uErr'), pErr = app.querySelector('#pErr'), cpErr = app.querySelector('#cpErr');
  uEl.oninput = () => uErr.textContent = '';
  pEl.oninput = () => pErr.textContent = '';
  cpEl.oninput = () => cpErr.textContent = '';
  app.querySelectorAll('.pass-toggle').forEach(b => {
    b.onclick = () => { const i = app.querySelector('#' + b.dataset.for); i.type = i.type === 'password' ? 'text' : 'password'; };
  });
  app.querySelector('#toLog').onclick = () => viewLogin();
  app.querySelector('#regBtn').onclick = async () => {
    const u = norm(uEl.value), p = pEl.value, cp = cpEl.value;
    if (u.length < 2) return uErr.textContent = 'Введите юзернейм';
    if (!/^[a-zA-Z0-9_]{2,32}$/.test(u)) return uErr.textContent = 'Только буквы, цифры и _ (2–32)';
    if (p.length < 6) return pErr.textContent = 'Минимум 6 символов';
    if (p !== cp) return cpErr.textContent = 'Пароли не совпадают';
    const btn = app.querySelector('#regBtn');
    setLoading(btn, true, 'Создание…');
    try {
      const cred = await createUserWithEmailAndPassword(auth, usernameToEmail(u), p);
      const isAdmin = u.toLowerCase() === MAIN_ADMIN.toLowerCase();
      await setDoc(doc(db, 'users', cred.user.uid), {
        username: u,
        isApproved: isAdmin,
        role: isAdmin ? 'admin' : 'user',
        banned: false,
        createdAt: new Date().toISOString()
      });
      toast('Аккаунт создан', 'ok');
    } catch (e) {
      setLoading(btn, false);
      const c = e.code || '';
      if (c.includes('email-already-in-use')) uErr.textContent = 'Этот юзернейм уже занят';
      else if (c.includes('weak-password')) pErr.textContent = 'Пароль слишком слабый';
      else if (c.includes('operation-not-allowed')) pErr.textContent = 'Включите Email/Password в Firebase';
      else uErr.textContent = 'Ошибка: ' + c;
    }
  };
  uEl.focus();
}

/* === ВЫХОД === */
const logoutBtnHtml = `<button class="exit" id="out">выйти</button>`;
function bindLogout() {
  const b = app.querySelector('#out');
  if (b) b.onclick = async () => { await signOut(auth); toast('Выход', 'ok'); };
}

function topbarHtml(roleLabel, roleClass) {
  return `
    <div class="topbar">
      ${avatarHtml(currentProfile.username)}
      <span class="who">
        <b>${esc(currentProfile.username)}</b>
        <span class="tag ${roleClass}">${roleLabel}</span>
      </span>
      ${logoutBtnHtml}
    </div>
  `;
}

/* === ОЖИДАЮЩИЙ === */
function viewPending() {
  app.innerHTML = `
    ${topbarHtml('не одобрен', 'tag-pending')}
    <div class="info">Ваша учётная запись ожидает одобрения администратора.<br>Свяжитесь с ним: <b>@${MAIN_ADMIN}</b></div>
  `;
  bindLogout();
}

/* === ЮЗЕР === */
async function viewUser() {
  app.innerHTML = `<div class="skel skel-item"></div><div class="skel skel-item"></div><div class="skel skel-item"></div>`;
  const myReqs = await loadMyRequests();
  app.innerHTML = `
    ${topbarHtml('участник', 'tag-user')}
    <div class="row">
      <label class="label">Опишите задачу</label>
      <textarea id="msg" placeholder="Изложите суть…"></textarea>
      <div class="err" id="msgErr"></div>
    </div>
    <button class="btn" id="sendBtn">Отправить заявку</button>
    <div class="section-h" style="margin-top:24px;">Мои заявки <span class="count">${myReqs.length}</span></div>
    <div id="list">
      ${myReqs.length ? myReqs.map(r => itemHtml(r, false)).join('') : '<div class="none">Пока нет заявок</div>'}
    </div>
  `;
  bindLogout();
  const msg = app.querySelector('#msg'), msgErr = app.querySelector('#msgErr');
  msg.oninput = () => msgErr.textContent = '';
  app.querySelector('#sendBtn').onclick = async () => {
    const txt = msg.value.trim();
    if (!txt) return msgErr.textContent = 'Поле не может быть пустым';
    const btn = app.querySelector('#sendBtn');
    setLoading(btn, true, 'Отправка…');
    try {
      await addDoc(collection(db, 'requests'), {
        from: currentProfile.username,
        fromUid: currentProfile.uid,
        text: txt,
        at: new Date().toISOString(),
        status: 'pending',
        assignedTo: null,
        materials: '',
        adminNotes: ''
      });
      toast('Заявка отправлена', 'ok');
      viewUser();
    } catch (e) {
      setLoading(btn, false);
      toast('Ошибка: ' + e.code, 'err');
    }
  };
}

async function loadMyRequests() {
  const q = query(collection(db, 'requests'), where('fromUid', '==', currentProfile.uid));
  const snap = await getDocs(q);
  const arr = [];
  snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
  return arr.sort((a, b) => new Date(b.at) - new Date(a.at));
}

function itemHtml(r, admin) {
  return `
    <div class="item" data-id="${r.id}">
      <div class="item-top">
        <div class="left">
          ${avatarHtml(r.from, 'sm')}
          <span class="from">${esc(r.from)}</span>
        </div>
        <span class="when">${fmtDate(r.at)}</span>
      </div>
      <div class="msg">${esc(r.text)}</div>
      <div class="item-status status-${r.status}">${statusName(r.status)}</div>
      ${r.assignedTo ? `<div class="info-line">→ ${esc(r.assignedTo)}</div>` : ''}
      ${r.adminNotes ? `<div class="info-line">💬 ${esc(r.adminNotes)}</div>` : ''}
      ${r.materials ? `<div class="info-line">📎 ${esc(r.materials)}</div>` : ''}
      ${admin ? `
      <div class="item-actions">
        <button data-act="assign">${r.assignedTo && r.assignedTo.toLowerCase() === currentProfile.username.toLowerCase() ? 'Отказаться' : 'Назначить себе'}</button>
        <button data-act="in-progress">В работе</button>
        <button data-act="completed">Выполнено</button>
        <input data-input="materials" placeholder="Материалы / данные">
        <button data-act="materials">Запросить материалы</button>
        <input data-input="note" placeholder="Комментарий">
        <button data-act="note">Сохранить</button>
        <button data-act="del" class="danger">Удалить</button>
      </div>` : ''}
    </div>
  `;
}

/* === АДМИН === */
async function viewAdmin() {
  app.innerHTML = `<div class="skel skel-item"></div><div class="skel skel-item"></div>`;

  const usersSnap = await getDocs(collection(db, 'users'));
  const allUsers = [];
  usersSnap.forEach(d => allUsers.push({ uid: d.id, ...d.data() }));
  const pendingUsers = allUsers.filter(u => !u.isApproved && u.username.toLowerCase() !== MAIN_ADMIN.toLowerCase());

  const reqSnap = await getDocs(collection(db, 'requests'));
  let allReqs = [];
  reqSnap.forEach(d => allReqs.push({ id: d.id, ...d.data() }));
  allReqs.sort((a, b) => new Date(b.at) - new Date(a.at));

  const filteredReqs = currentFilter === 'all' ? allReqs : allReqs.filter(r => r.status === currentFilter);

  app.innerHTML = `
    ${topbarHtml('админ', 'tag-admin')}

    <div class="section-h">Неодобренные <span class="count">${pendingUsers.length}</span></div>
    <div id="pendList" style="margin-bottom:20px;">
      ${pendingUsers.length ? pendingUsers.map(u => `
        <div class="item" data-uid="${u.uid}">
          <div class="item-top">
            <div class="left">${avatarHtml(u.username, 'sm')}<span class="from">${esc(u.username)}</span></div>
          </div>
          <div class="item-actions">
            <button data-act="approve" class="good">Одобрить</button>
            <button data-act="make-admin">Сделать админом</button>
            <button data-act="del" class="danger">Удалить</button>
          </div>
        </div>
      `).join('') : '<div class="none">Нет заявок на одобрение</div>'}
    </div>

    <div class="section-h">Все заявки <span class="count">${allReqs.length}</span>
      <button id="exportBtn" style="margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:10px;padding:2px 8px;border-radius:4px;cursor:pointer;font-family:inherit;">CSV</button>
    </div>
    <div class="filters" id="filters">
      <button data-f="all" class="${currentFilter==='all'?'active':''}">Все</button>
      <button data-f="pending" class="${currentFilter==='pending'?'active':''}">Ожидает</button>
      <button data-f="in-progress" class="${currentFilter==='in-progress'?'active':''}">В работе</button>
      <button data-f="completed" class="${currentFilter==='completed'?'active':''}">Выполнено</button>
      <button data-f="materials" class="${currentFilter==='materials'?'active':''}">Материалы</button>
    </div>
    <div id="reqList">
      ${filteredReqs.length ? filteredReqs.map(r => itemHtml(r, true)).join('') : '<div class="none">Заявок нет</div>'}
    </div>
  `;
  bindLogout();

  app.querySelectorAll('#filters button').forEach(b => {
    b.onclick = () => { currentFilter = b.dataset.f; viewAdmin(); };
  });

  app.querySelector('#exportBtn').onclick = () => exportCsv(allReqs);

  // pending users
  app.querySelectorAll('#pendList .item').forEach(el => {
    const uid = el.dataset.uid;
    el.querySelectorAll('button[data-act]').forEach(b => {
      b.onclick = async () => {
        try {
          if (b.dataset.act === 'approve') {
            await updateDoc(doc(db, 'users', uid), { isApproved: true, role: 'user' });
            toast('Одобрен', 'ok');
          } else if (b.dataset.act === 'make-admin') {
            await updateDoc(doc(db, 'users', uid), { isApproved: true, role: 'admin' });
            toast('Теперь админ', 'ok');
          } else if (b.dataset.act === 'del') {
            if (!confirm('Удалить пользователя?')) return;
            await deleteDoc(doc(db, 'users', uid));
            toast('Удалён', 'ok');
          }
          viewAdmin();
        } catch (e) { toast('Ошибка: ' + e.code, 'err'); }
      };
    });
  });

  // requests
  app.querySelectorAll('#reqList .item').forEach(el => {
    const id = el.dataset.id;
    el.querySelectorAll('button[data-act]').forEach(b => {
      b.onclick = async () => {
        const act = b.dataset.act;
        const ref = doc(db, 'requests', id);
        try {
          if (act === 'assign') {
            const isMine = b.textContent.includes('Отказаться');
            await updateDoc(ref, { assignedTo: isMine ? null : currentProfile.username });
          } else if (act === 'in-progress') {
            await updateDoc(ref, { status: 'in-progress', materials: '' });
          } else if (act === 'completed') {
            await updateDoc(ref, { status: 'completed', materials: '' });
          } else if (act === 'materials') {
            const v = el.querySelector('[data-input="materials"]').value.trim();
            await updateDoc(ref, { status: 'materials', materials: v });
          } else if (act === 'note') {
            const v = el.querySelector('[data-input="note"]').value.trim();
            await updateDoc(ref, { adminNotes: v });
          } else if (act === 'del') {
            if (!confirm('Удалить заявку?')) return;
            await deleteDoc(ref);
          }
          viewAdmin();
        } catch (e) { toast('Ошибка: ' + e.code, 'err'); }
      };
    });
  });
}

/* === CSV ЭКСПОРТ === */
function exportCsv(reqs) {
  const rows = [['Дата', 'От', 'Текст', 'Статус', 'Исполнитель', 'Комментарий']];
  reqs.forEach(r => rows.push([
    r.at,
    r.from,
    (r.text || '').replace(/"/g, '""'),
    statusName(r.status),
    r.assignedTo || '',
    (r.adminNotes || '').replace(/"/g, '""')
  ]));
  const csv = rows.map(row => row.map(c => `"${c}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `requests_${Date.now()}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('CSV скачан', 'ok');
}
